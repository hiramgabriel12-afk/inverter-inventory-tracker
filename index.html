<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Inverter Inventory Tracker</title><style>body{font:16px system-ui;background:#f3f5f8;color:#14213d;margin:0}main{max-width:620px;margin:auto;padding:18px}h1{font-size:25px}section{background:white;padding:18px;border-radius:14px;margin:15px 0;box-shadow:0 2px 10px #0001}label{display:block;font-weight:600;margin-top:12px}input,select,button{box-sizing:border-box;width:100%;font:inherit;padding:12px;margin-top:5px;border:1px solid #bac3ce;border-radius:9px}button{background:#174c91;color:white;font-weight:700;cursor:pointer;margin-top:14px}button.secondary{background:#475569}button:disabled{opacity:.5}small{color:#526174}#video{width:100%;max-height:280px;background:#111;display:none}table{width:100%;font-size:12px;border-collapse:collapse}td,th{border-bottom:1px solid #ddd;padding:6px;text-align:left;overflow-wrap:anywhere}.scroll{overflow:auto}#notice{font-weight:600}</style>
<main><h1>Inverter Inventory Tracker</h1><small>Prototype • Records stay in this browser, not GitHub. Use only with company authorization.</small>
<section><button id="scan">Scan QR with camera</button><video id="video" playsinline muted></video><button id="stop" class="secondary" hidden>Stop camera</button><small>Camera scanning requires a supported browser and a secure HTTPS origin. Manual entry works offline.</small>
<label>Original QR text<input id="raw" placeholder="Scan or paste full QR text"></label>
<label>Serial number<input id="serial" placeholder="PVUL0840URNH4286" required></label>
<label>Status<select id="status"><option>Staged</option><option>Assigned</option><option>Waiting to Be Shipped</option><option>Damaged</option></select></label>
<label>Location type<select id="type"><option>Warehouse</option><option>Integrator</option></select></label>
<label>Warehouse / Integrator name<input id="location" required></label>
<label>Project number<input id="project" placeholder="Required when assigned or shipping"></label><label>MVPS number<input id="mvps" placeholder="Required when assigned or shipping"></label>
<button id="save">Save / update unit</button><p id="notice" role="status"></p></section>
<section><h2>Inventory <span id="count"></span></h2><input id="search" placeholder="Search serial, location, project"><button id="export">Export CSV</button><button id="backup" class="secondary">Backup Inventory (JSON)</button><label>Restore backup JSON<input id="restore" type="file" accept=".json,application/json"></label><p id="backupNotice" role="status"></p><div class="scroll"><table><thead><tr><th>Serial</th><th>Status</th><th>Location</th><th>Project</th><th>MVPS</th><th>Action</th></tr></thead><tbody id="rows"></tbody></table></div></section>
<section><h2>Recently Deleted</h2><div id="trash"></div></section></main><script>
const $=id=>document.getElementById(id), KEY="mvps_inventory_v1";
let records=[], deleted=[];try{records=JSON.parse(localStorage.getItem(KEY)||"[]");deleted=JSON.parse(localStorage.getItem(KEY+"_trash")||"[]")}catch{}
let changes=0;function persist(){localStorage.setItem(KEY,JSON.stringify(records));localStorage.setItem(KEY+"_trash",JSON.stringify(deleted))}function remind(){changes++;if(changes%10===0){$("backupNotice").textContent="Backup reminder: "+changes+" changes. Save a full JSON backup to your approved OneDrive folder.";alert("Backup reminder: save your inventory backup now ("+changes+" changes).")}}
function extract(raw){const m=raw.match(/\bPVUL[A-Z0-9]{7,}\b/i);return m?m[0].toUpperCase():""}
function populate(r){$("serial").value=r.serial;$("raw").value=r.raw;$("status").value=r.status;$("type").value=r.type;$("location").value=r.location;$("project").value=r.project;$("mvps").value=r.mvps||""}
function lookup(){let id=$("serial").value.trim().toUpperCase();const r=records.find(x=>x.serial===id);if(r){populate(r);$("notice").textContent="UNIT ALREADY REGISTERED — existing record loaded for editing."}}
$("raw").oninput=()=>{const id=extract($("raw").value);if(id){$("serial").value=id;lookup()}};
$("serial").onchange=lookup;
$("save").onclick=()=>{let serial=$("serial").value.trim().toUpperCase(),location=$("location").value.trim();if(!serial||!location){$("notice").textContent="Serial number and location name are required.";return}
if(["Assigned","Waiting to Be Shipped"].includes($("status").value)&&(!$("project").value.trim()||!$("mvps").value.trim())){$("notice").textContent="Project and MVPS numbers are required for this status.";return}
let r={serial,raw:$("raw").value.trim(),status:$("status").value,type:$("type").value,location,project:$("project").value.trim(),mvps:$("mvps").value.trim(),modified:new Date().toISOString()};
records=records.filter(x=>x.serial!==serial);records.push(r);
try{persist();$("notice").textContent="Saved locally: "+serial;remind();render()}catch{$("notice").textContent="Storage failed. Export your existing data."}};
function render(){const q=$("search").value.toLowerCase();$("rows").replaceChildren();for(const r of records.filter(r=>[r.serial,r.location,r.project,r.mvps,r.status].join(" ").toLowerCase().includes(q))){let tr=document.createElement("tr");for(const value of [r.serial,r.status,r.type+": "+r.location,r.project,r.mvps]){let td=document.createElement("td");td.textContent=value;td.onclick=()=>{populate(r);window.scrollTo({top:0,behavior:"smooth"})};tr.append(td)}let td=document.createElement("td"),btn=document.createElement("button");btn.textContent="Delete";btn.className="secondary";btn.onclick=()=>{if(confirm("Delete ONLY unit "+r.serial+"?")){records=records.filter(x=>x.serial!==r.serial);deleted.push(r);persist();remind();render()}};td.append(btn);tr.append(td);$("rows").append(tr)}$("count").textContent="("+records.length+")";$("trash").replaceChildren();for(const r of deleted){let b=document.createElement("button");b.className="secondary";b.textContent="Restore "+r.serial;b.onclick=()=>{if(records.some(x=>x.serial===r.serial)){alert("Serial already exists");return}deleted=deleted.filter(x=>x!==r);records.push(r);persist();render()};$("trash").append(b)}}
$("search").oninput=render;
function download(name,blob){const url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),2000)}
$("backup").onclick=()=>{download("Inverter_Inventory_Backup.json",new Blob([JSON.stringify({version:1,records,deleted,exported:new Date().toISOString()},null,2)],{type:"application/json"}));$("backupNotice").textContent="Backup downloaded. Move or save it to your approved OneDrive folder; download alone does not upload it."};
$("restore").onchange=async()=>{const f=$("restore").files[0];if(!f)return;try{const d=JSON.parse(await f.text());if(!Array.isArray(d.records)||!Array.isArray(d.deleted))throw Error("Invalid backup");if(!confirm("Replace local inventory with this backup ("+d.records.length+" units)?"))return;records=d.records;deleted=d.deleted;persist();render();$("backupNotice").textContent="Backup restored"}catch(e){alert("Could not restore: "+e.message)}};

$("export").onclick=()=>{const cols=["serial","raw","status","type","location","project","mvps","modified"];const quote=v=>'"'+String(v??"").replaceAll('"','""')+'"';const csv=[cols.join(","),...records.map(r=>cols.map(c=>quote(r[c])).join(","))].join("\r\n");const url=URL.createObjectURL(new Blob(["\ufeff"+csv],{type:"text/csv;charset=utf-8"}));const a=document.createElement("a");a.href=url;a.download="MVPS_Inventory_"+new Date().toISOString().slice(0,10)+".csv";a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
let stream=null,scanning=false;
function stop(){scanning=false;if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;$("video").style.display="none";$("stop").hidden=true}
$("stop").onclick=stop;
$("scan").onclick=async()=>{if(!window.isSecureContext){$("notice").textContent="Camera requires HTTPS. Open the hosted site, not the downloaded HTML file.";return}if(!("BarcodeDetector" in window)){ $("notice").textContent="Camera QR detection is unavailable in this browser. Paste QR text or enter serial manually.";return}
try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"}});$("video").srcObject=stream;$("video").style.display="block";$("stop").hidden=false;await $("video").play();scanning=true;const detector=new BarcodeDetector({formats:["qr_code"]});async function loop(){if(!scanning)return;try{const found=await detector.detect($("video"));if(found.length){$("raw").value=found[0].rawValue;$("raw").dispatchEvent(new Event("input"));$("notice").textContent="QR scanned. Verify serial before saving.";stop();return}}catch{}setTimeout(loop,250)}loop()}catch(e){stop();$("notice").textContent="Camera unavailable: "+e.message}};
render();
</script></html>
